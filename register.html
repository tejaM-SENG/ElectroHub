<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ElectroHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<section class="register-section">
    <div class="register-container">
        <!-- LEFT SIDE -->
        <div class="register-image">
            <div class="overlay">
                <h1>Join ElectroHub</h1>
                <p>
                    Create an account and enjoy exclusive deals,
                    faster checkout, and order tracking.
                </p>
            </div>
        </div>
        <!-- RIGHT SIDE -->
        <div class="register-form-container">
            <h2>Create Account</h2>
            <p class="subtitle">
                Fill in your details below
            </p>
            <form>
                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Full Name">
                </div>
                <div class="mb-3">
                    <label>Email Address</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Enter Email">
                </div>
                <div class="mb-3">
                    <label>Phone Number</label>
                    <input type="tel"
                           class="form-control"
                           placeholder="Enter Phone Number">
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password"
                           class="form-control"
                           placeholder="Create Password">
                </div>
                <div class="mb-3">
                    <label>Confirm Password</label>
                    <input type="password"
                           class="form-control"
                           placeholder="Confirm Password">
                </div>
            </form>
                <button onclick="location.href='login.html', alert('Account Created Successfully')"
                        class="register-btn">
                    Create Account
                </button>
            <div class="login-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </div>
        </div>
    </div>
</section>
</body>

</html>
